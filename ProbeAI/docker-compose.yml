version: '3.8'

services:
  backend:
    build: ./backend
    container_name: probeai_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/probeai_sessions.db:/app/probeai_sessions.db
    restart: always

  frontend:
    build: ./frontend
    container_name: probeai_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always